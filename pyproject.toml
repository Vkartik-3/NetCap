[project]
name = "netcap"
version = "0.1.0"
description = "Backbone capacity planning on real traffic data"
requires-python = ">=3.13"

[tool.pytest.ini_options]
testpaths = ["tests_netcap"]
pythonpath = [".", "research"]
addopts = "-p no:cacheprovider"

[tool.coverage.run]
source = ["netcap"]
omit = ["netcap/audit/*"]

[tool.ruff]
line-length = 120
extend-exclude = ["research", "netcap/audit"]   # forecasting module code (never changed); Phase 0 audit scripts kept as run

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E731", "E741"]                       # lambdas and short names, as in the forecasting module
