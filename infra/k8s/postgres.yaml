apiVersion: v1
kind: Secret
metadata:
  name: netcap-db
  namespace: netcap
type: Opaque
stringData:
  POSTGRES_USER: netcap
  POSTGRES_PASSWORD: change-me          # replace before any shared deployment
  POSTGRES_DB: netcap
  NETCAP_DATABASE_URL: postgresql://netcap:change-me@netcap-db:5432/netcap
---
apiVersion: v1
kind: Service
metadata:
  name: netcap-db
  namespace: netcap
spec:
  selector:
    app: netcap-db
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: netcap-db
  namespace: netcap
spec:
  serviceName: netcap-db
  replicas: 1
  selector:
    matchLabels:
      app: netcap-db
  template:
    metadata:
      labels:
        app: netcap-db
    spec:
      containers:
        - name: postgres
          image: postgres:17.4-bookworm
          envFrom:
            - secretRef:
                name: netcap-db
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "netcap", "-d", "netcap"]
            periodSeconds: 5
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "2", memory: 2Gi}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
