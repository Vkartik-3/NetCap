apiVersion: batch/v1
kind: Job
metadata:
  name: netcap-ingest-abilene
  namespace: netcap
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: ingest
          image: netcap:1.0
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "python -m netcap.pipeline.ingest parquet abilene && python -m netcap.pipeline.ingest postgres abilene"]
          env:
            - name: NETCAP_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: netcap-db
                  key: NETCAP_DATABASE_URL
          resources:
            requests: {cpu: 500m, memory: 2Gi}
            limits: {cpu: "2", memory: 4Gi}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: raw
              mountPath: /raw/abilene
              readOnly: true
      volumes:
        - name: data
          hostPath: {path: /netcap/data, type: Directory}
        - name: raw
          hostPath: {path: /netcap/raw/abilene, type: Directory}
