apiVersion: apps/v1
kind: Deployment
metadata:
  name: netcap-api
  namespace: netcap
spec:
  replicas: 2
  selector:
    matchLabels:
      app: netcap-api
  template:
    metadata:
      labels:
        app: netcap-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: api
          image: netcap:1.0                 # kind load docker-image netcap:1.0 --name netcap
          imagePullPolicy: IfNotPresent
          env:
            - name: NETCAP_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: netcap-db
                  key: NETCAP_DATABASE_URL
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests: {cpu: 250m, memory: 1Gi}
            limits: {cpu: "2", memory: 3Gi}
          volumeMounts:
            - name: data
              mountPath: /data
              readOnly: true
      volumes:
        - name: data
          hostPath:
            path: /netcap/data
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: netcap-api
  namespace: netcap
spec:
  type: NodePort
  selector:
    app: netcap-api
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080
